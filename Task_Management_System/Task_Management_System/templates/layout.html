<!DOCTYPE html>
<html lang="en">
<!--#region ======= Head ======= -->
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - TMS</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- DataTables CSS for Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
    <script src="https://unpkg.com/tippy.js@6"></script>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<!--#endregion ======= Head ======= -->
<body>

    <!--#region ======= Header ======= -->
    <header class="app-header d-flex align-items-center justify-content-between px-3 shadow-sm">
        <div class="header-left d-flex align-items-center">
            <a href="{{ url_for('dashboard') }}" class="app-name text-decoration-none">Task Management System</a>
        </div>
        <div class="header-right d-flex align-items-center">
            <div class="dropdown">
                <a class="d-flex align-items-center text-decoration-none dropdown-toggle user-menu" href="#" role="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-2"></i>
                    {{ user_info.name }}
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item text-primary" href="javascript:void(0)">{{ user_info.email }}</a></li>
                    <li><hr class="dropdown-divider"></li>
                    {% if user_info.roleId in [1, 2] %}
                    <li><a class="dropdown-item text-info" href="{{ url_for('admin') }}">Admin Panel</a></li>
                    <li><hr class="dropdown-divider"></li>
                    {% endif %}

                    <li><a class="dropdown-item text-danger" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
            </div>
        </div>
    </header>
    <!--#endregion ======= Header ======= -->

    <!--#region ======= Main Content ======= -->
    <main class="app-content">
        <div class="container-fluid p-4">
            {% block content %}{% endblock %}
        </div>
    </main>
    <!--#endregion ======= Main Content ======= -->

    <!--#region ======= Dynamic Modal ======= -->
    <div class="modal fade" id="dynamicModal" tabindex="-1" aria-labelledby="dynamicModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="max-height: 80vh; overflow-y: auto;"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btnAddEdit"></button>
                </div>
            </div>
        </div>
    </div>
    <!--#endregion ======= Dynamic Modal ======= -->

    <!--#region ======= Scripts ======= -->
    <script>
        // Sidebar toggle for mobile
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        toggleBtn?.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        document.addEventListener("DOMContentLoaded", function () {
            tippy.delegate(document.body, {
                target: '[data-tippy-content]', // any element with this attribute
                theme: 'light-border',          // modern style
                animation: 'scale',             // smooth animation
                arrow: true,
                delay: [100, 100],
            });
        });
    </script>
    <!--#endregion ======= Scripts ======= -->

</body>
</html>
