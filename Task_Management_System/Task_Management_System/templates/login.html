<!DOCTYPE html>
<html lang="en">
<!--#region ======= Head ======= -->
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - TMS</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- DataTables CSS for Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
    <script src="https://unpkg.com/tippy.js@6"></script>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<!--#endregion ======= Head ======= -->
<body>

    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-lg-4 col-md-6 col-sm-10">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <!-- Logo / Title -->
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-primary mb-1">TMS</h3>
                            <p class="text-muted mb-0">Task Management System</p>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" placeholder="Enter username or email" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                    <span class="input-group-text bg-white cursor-pointer" onclick="togglePassword()">
                                        <i class="bi bi-eye" id="toggleIcon"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-muted">Remember me</label>
                                </div>
                                <a href="javascript:void(0)" class="text-decoration-none small text-primary" onclick="showReset()">Forgot password?</a>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-3">
                                    <i class="bi bi-box-arrow-in-right me-2"></i> Login
                                </button>
                            </div>
                        </form>

                        <!-- Reset Password Form -->
                        <form id="resetForm" style="display:none;">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="resetUsername" placeholder="Enter username or email" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Old Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="oldPassword" placeholder="Old password" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="newPassword" placeholder="New password" required>
                                </div>
                            </div>
                            <div class="d-grid mb-2">
                                <button type="submit" class="btn btn-primary btn-lg rounded-3">
                                    <i class="bi bi-arrow-repeat me-2"></i> Update Password
                                </button>
                            </div>
                            <div class="text-center">
                                <a href="javascript:void(0)" class="text-decoration-none small text-primary" onclick="showLogin()">Back to Login</a>
                            </div>
                        </form>

                        <div id="message" class="mt-3 text-center"></div>

                    </div>
                </div>

                <!-- Footer -->
                <div class="text-center mt-3 text-muted small">
                    © 2026 TMS. All rights reserved.
                </div>

            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const password = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");

            if (password.type === "password") {
                password.type = "text";
                icon.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                password.type = "password";
                icon.classList.replace("bi-eye-slash", "bi-eye");
            }
        }

        // Login submit
        $("#loginForm").on("submit", function (e) {
            e.preventDefault();

            const payload = {
                username: $("#username").val(),
                password: $("#password").val(),
                rememberMe: $("#rememberMe").is(":checked")
            };

            dynamicResponse("/api/login", payload, {
                onSuccess: (res) => {
                    toastr.success(res.message || "Login successful");
                    window.location.href = "/dashboard";
                },
                onError: (err) => {
                    toastr.error(err.message || "Login failed");
                }
            }, "POST");
        });

        // Show reset form
        function showReset() {
            $("#loginForm").hide();
            $("#resetForm").show();
            $("#message").html("");
        }
        // Show login form
        function showLogin() {
            $("#loginForm").show();
            $("#resetForm").hide();
            $("#resetUsername").val("");
            $("#oldPassword").val("");
            $("#newPassword").val("");
            $("#message").html("");
        }

        // Reset password submit
        $("#resetForm").on("submit", function (e) {
            e.preventDefault();

            const payload = {
                username: $("#resetUsername").val(),
                oldPassword: $("#oldPassword").val(),
                newPassword: $("#newPassword").val()
            };

            dynamicResponse("/api/reset_password", payload, {
                onSuccess: (res) => {
                    toastr.success(res.message || "Password Reset successfully!");
                    showLogin();
                },
                onError: (err) => {
                    toastr.error(err.message || "Rest Password failed");
                    $("#message").html('<span class="text-danger">' + res.message + '</span>');
                }
            }, "POST");
        });
        
    </script>

</body>
</html>
