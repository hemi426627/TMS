
<style>
    /* Kanban Board */
    .kanban-board {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 10px;
    }

    /* Columns */
    .kanban-column {
        background: var(--secondary-color);
        border-radius: 12px;
        flex: 1;
        min-width: 280px;
        max-width: 350px;
        display: flex;
        flex-direction: column;
        padding: 15px;
    }

        .kanban-column h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #fff !important;
            text-align: center;
            border-bottom: 1px solid #bdc3c7;
            padding-bottom: 5px;
        }

    .task-counter-card {
        flex: 0 0 auto;
        /* prevent shrinking */
        background: #fff;
        padding: 12px 18px;
        border-radius: 8px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        text-align: center;
        min-width: 110px;
        cursor: default;
        transition: transform 0.2s, box-shadow 0.2s;
    }

        .task-counter-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
        }

    .task-counter-title {
        font-size: 0.85rem;
        color: #7f8c8d;
        margin-bottom: 5px;
        text-transform: uppercase;
    }

    .task-counter-number {
        font-size: 1.2rem;
        font-weight: 600;
        color: #34495e;
    }

    /* Cards */
    .kanban-card {
        position: relative;
        /* Needed for badge positioning */
        background: #fff;
        padding: 12px 15px;
        margin-bottom: 12px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        cursor: grab;
        display: flex;
        flex-direction: column;
        height: 220px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

        .kanban-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
        }

        .kanban-card.dragging {
            opacity: 0.6;
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }


    .kanban-column.drag-over {
        border: 2px dashed #3498db;
    }

    /* Card Content */
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    .card-title {
        font-size: 0.82rem;
        color: var(--primary-color) !important;
        font-weight: 500;
        margin-bottom: 6px;
    }

    .badge {
        padding: 2px 6px;
        border-radius: 12px;
        font-size: 12px;
        text-transform: capitalize;
        white-space: nowrap;
    }

    .card-content {
        font-size: 0.78rem;
        overflow-y: auto;
        overflow-x: hidden;
    }

        .card-content::-webkit-scrollbar {
            width: 6px;
        }

        .card-content::-webkit-scrollbar-thumb {
            background: #bdc3c7;
            border-radius: 3px;
        }

    @media (max-width: 576px) {
        .task-counter-bar {
            padding: 8px;
            gap: 10px;
        }

        .task-counter-card {
            min-width: 90px;
            padding: 10px 12px;
        }

        .task-counter-title {
            font-size: 0.75rem;
        }

        .task-counter-number {
            font-size: 1rem;
        }
    }
</style>

<!--#region Tabs -->
<ul id="appTabs" class="nav nav-tabs">
    <li><a class="nav-link active" data-tab="tasks" data-load="LoadMainTasks">Tasks</a></li>
    <li><a class="nav-link" data-tab="daily" data-load="LoadDailyTasks">Daily Tasks</a></li>
</ul>
<!--#endregion Tabs -->

<!--#region Tab Content -->
<div id="tabContent" class="mt-4">
    <div class="tab-pane" id="dashboard"></div>
    <div class="tab-pane" id="tasks">
        <div class="kanban-board" id="mainTasks"></div>
    </div>
    <div class="tab-pane" id="daily">
        <div class="kanban-board" id="dailyTasks"></div>
    </div>
</div>
<!--#endregion Tab Content -->

<script>

    //#region Load Tabs
    dynamicTabs({
        defaultTab: 'tasks'
    });
    //#endregion Load Tabs

    //#region Load Main Tasks
    function LoadMainTasks() {
        dynamicResponse(`/api/get_user_main_tasks`, {}, {
            onSuccess: (res) => {
                renderMainTaskBoard(res.data);
            },
            onError: (err) => {
                toastr.error(err.message);
            }
        });
    }
    let draggedCardMainTask = null;
    function renderMainTaskBoard(data) {
        const board = document.getElementById('mainTasks');
        board.innerHTML = '';

        data.tasks_status.forEach(statusObj => {
            const { status_code, status } = statusObj;

            const column = document.createElement('div');
            column.className = 'kanban-column';
            column.dataset.status = status_code;

            const title = document.createElement('h2');
            title.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;"><span>${status}</span><span class="badge bg-info">${data.status_counter?.[status] ?? 0}</span></div>`;
            column.appendChild(title);

            var tasks = data.tasks_by_status[status_code] || [];
            tasks.forEach(task => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = createCard(task);
                const card = tempDiv.firstElementChild;

                // RULE: REVIEW tasks cannot be dragged
                if (status_code !== "REVIEW") {
                    card.draggedCardMainTask = true;

                    card.addEventListener('dragstart', () => {
                        draggedCardMainTask = card;
                        card.classList.add('dragging');
                    });
                    card.addEventListener('dragend', () => {
                        draggedCardMainTask = null;
                        card.classList.remove('dragging');
                    });
                }

                column.appendChild(card);
            });

            // Column Drag & Drop
            column.addEventListener('dragover', e => {
                e.preventDefault();
                // RULE: Cannot drop into ASSIGNED column
                if (column.dataset.status !== "ASSIGNED") {
                    column.classList.add('drag-over');
                }
            });

            column.addEventListener('dragleave', () => column.classList.remove('drag-over'));

            column.addEventListener('drop', () => {
                column.classList.remove('drag-over');
                if (!draggedCardMainTask) return;

                const taskId = parseInt(draggedCardMainTask.dataset.id);
                const taskAssignId = parseInt(draggedCardMainTask.dataset.taskassignid, 10);
                const oldstatus = draggedCardMainTask.dataset.oldstatus;
                const workstatus = draggedCardMainTask.dataset.workstatus;
                const new_status = column.dataset.status;

                const leadBy = draggedCardMainTask.dataset.leadBy;

                // RULE: Prevent dropping into ASSIGNED column
                if (new_status === "ASSIGNED") {
                    toastr.error("Can't Drop Task To Assigned");
                    return;
                }

                if (new_status === "REVIEW") {
                    toastr.error("Can't Drop Task To Review");
                    return;
                }

                var objJson = new Object();
                objJson.taskId = taskId;
                objJson.taskAssignId = taskAssignId;

                if (new_status === "COMPLETED" && oldstatus === "COMPLETED" && workstatus === "APPROVED") {
                    Swal.fire({
                        title: 'Task Already Completed!',
                        text: 'You can reopen the task and select a new status.',
                        icon: 'warning',
                        input: 'select',
                        inputOptions: {
                            "NOT_STARTED": "Not Started",
                            "IN_PROGRESS": "In Progress",
                        },
                        inputPlaceholder: 'Select new status',
                        showCancelButton: true,
                        confirmButtonText: 'Update Status',
                        cancelButtonText: 'Cancel'
                    }).then((result) => {
                        if (result.isConfirmed && result.value) {
                            objJson.new_status = result.value;
                            UpdateTask(objJson);
                        }
                    });
                }
                else if (new_status === "COMPLETED") {
                    Swal.fire({
                        title: 'Task Completed!',
                        html: `This task is now going for approval. Lead by: <b>${leadBy}</b>`,
                        icon: 'info',
                        input: 'textarea',
                        inputPlaceholder: 'Enter approval comment...',
                        showCancelButton: true,
                        confirmButtonText: 'Send for Approval',
                        cancelButtonText: 'Cancel',
                        preConfirm: (comment) => {
                            if (!comment || comment.trim() === "") {
                                Swal.showValidationMessage('Please enter a comment for approval');
                            }
                            return comment.trim();
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            objJson.new_status = new_status;  
                            objJson.submitComment = result.value;
                            UpdateTask(objJson);
                        }
                    });
                }
                else {
                    objJson.new_status = new_status;
                    UpdateTask(objJson);
                }                
            });

            board.appendChild(column);
        });
    }
    function UpdateTask(requestData) {
        dynamicResponse(
            `/api/update_main_task_status`,
            requestData,
            {
                onSuccess: res => {
                    LoadMainTasks();
                    toastr.success(res.message);
                },
                onError: err => {
                    toastr.error(err.message || "Failed to update");
                }
            },
            "POST"
        );
    }
    function Approve_Reject_Task(taskId, taskAssignId, reject=false) {
        Swal.fire({
            title: `${reject ? "Rejection" : "Approved"} Task!`,
            html: `Are you sure you want to <b>${reject ? "reject" : "approve"}</b> this task?`,
            icon: 'info',
            input: 'textarea',
            inputPlaceholder: 'Enter approval comment...',
            showCancelButton: true,
            confirmButtonText: reject ? "Rejected" : "Approved",
            cancelButtonText: 'Cancel',
            preConfirm: (comment) => {
                if (!comment || comment.trim() === "") {
                    Swal.showValidationMessage(`Please enter a comment for ${reject ? "reject" : "approve"}`);
                }
                return comment.trim();
            }
        }).then((result) => {
            if (result.isConfirmed) {
                var objJson = new Object();
                objJson.taskId = taskId;
                objJson.taskAssignId = taskAssignId;
                objJson.new_status = reject ? "REJECTED" : "PENDING_APPROVAL";
                objJson.reviewComment = result.value;

                UpdateTask(objJson);
            }
        });
    }
    //#endregion Load Main Tasks

    //#region Kanban Card
    function createCard(task) {
        // ------------- Work Status Badge ----------------
        let workStatusBadgeClass = "";
        switch (task.work_status_code) {
            case 'UN_ASSIGNED': workStatusBadgeClass = 'bg-secondary'; break;
            case 'ASSIGNED': workStatusBadgeClass = 'bg-secondary'; break;
            case 'NOT_STARTED': workStatusBadgeClass = 'bg-info'; break;
            case 'WORKING': workStatusBadgeClass = 'bg-success'; break;
            case 'PENDING_APPROVAL': workStatusBadgeClass = 'bg-danger'; break;
            case 'APPROVED': workStatusBadgeClass = 'bg-success'; break;
            case 'REJECTED': workStatusBadgeClass = 'bg-danger'; break;
            default: workStatusBadgeClass = 'bg-primary'; break;
        }

        // ------------- Status Badge ----------------
        let statusBadgeClass = "";
        switch (task.status_code) {
            case 'NOT_STARTED': statusBadgeClass = 'bg-secondary'; break;
            case 'IN_PROGRESS': statusBadgeClass = 'bg-primary'; break;
            case 'COMPLETED': statusBadgeClass = 'bg-success'; break;
            case 'ON_HOLD': statusBadgeClass = 'bg-warning text-dark'; break;
            default: statusBadgeClass = 'bg-info'; break;
        }

        // ------------- Priority Badge ----------------
        let priorityBadgeClass = "";
        switch (task.priority_code) {
            case 'HIGH': priorityBadgeClass = 'bg-danger'; break;
            case 'MEDIUM': priorityBadgeClass = 'bg-warning text-dark'; break;
            case 'LOW': priorityBadgeClass = 'bg-success'; break;
            case 'CRITICAL': priorityBadgeClass = 'bg-secondary'; break;
            default: priorityBadgeClass = 'bg-info'; break;
        }

        // ------------- Badges ----------------
        let leadByBadge = task.leadBy != null ? `<span class="badge bg-dark">Lead By ${task.leadBy}</span>` : "";
        let priorityBadge = task.priority != "" ? `<span class="badge ${priorityBadgeClass} me-1">${task.priority}</span>` : "";

        let workStatusBadge = task.work_status != "" ? `<span class="badge ${workStatusBadgeClass}">${task.work_status}</span>` : "";
        let isSubTaskBadge = task.subTaskId.length > 0 ? `<span class="badge bg-info me-1">Subtask</span>` : "";
        let subTaskBadge = task.totalSubTasks > 0 ? `<span class="badge bg-info me-1">Sub Tasks (${task.totalSubTasks})</span>` : "";
        let statusBadge = task.status != "" ? `<span class="badge ${statusBadgeClass}">${task.status}</span>` : "";

        // ------------- Approval Buttons ----------------
        let approvalHtml = "";
        if (task.isLead && task.work_status_code === 'PENDING_APPROVAL') {
            approvalHtml = `<div class="approval-buttons mb-2">`;
            approvalHtml += `<button class="btn btn-success btn-sm me-1" style="font-size:9px;" onclick="Approve_Reject_Task(${task.taskId},${task.taskAssignId},false)">Approve</button>`;
            approvalHtml += `<button class="btn btn-danger btn-sm" style="font-size:9px;" onclick="Approve_Reject_Task(${task.taskId},${task.taskAssignId},true)">Reject</button>`;
            approvalHtml += `</div>`;
        }

        // ------------- Duration Safe ----------------
        let durationText = "-";
        if (task.duration) {
            durationText = `${task.duration.days}d ${task.duration.hours}h ${task.duration.minutes}m`;
        }

        // ------------- Remaining Days Safe ----------------
        let remainingDaysText = task.remainingDays !== null ? task.remainingDays : "-";

        // ------------- Format ETA Date ----------------
        let etaText = "-";
        if (task.eta_datetime) {
            let eta = new Date(task.eta_datetime);
            if (!isNaN(eta)) {
                let day = String(eta.getDate()).padStart(2, "0");
                let monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                let month = monthNames[eta.getMonth()];
                let year = String(eta.getFullYear()).slice(-2); // last two digits
                let hours = String(eta.getHours()).padStart(2, "0");
                let minutes = String(eta.getMinutes()).padStart(2, "0");
                etaText = `${day} ${month} ${year} ${hours}:${minutes}`;
            }
        }

        let card = "";
        card += `<div class="kanban-card" draggable="true" data-id="${task.taskId}" data-taskAssignId="${task.taskAssignId}" data-oldstatus="${task.status_code}" data-workstatus="${task.work_status_code}" data-leadBy="${task.leadBy}">`;

        card += `<div class="card-title">${task.taskName} <span class="view-icon cursor-pointer" onclick="showTaskModal('${task.taskName}','${task.taskdetail}')">🔍</span></div>`;

        card += `<div class="card-header mb-2">${leadByBadge} ${priorityBadge}</div>`;
        card += `<div class="card-header mb-2">${workStatusBadge} ${isSubTaskBadge} ${subTaskBadge} ${statusBadge}</div>`;

        card += approvalHtml;

        card += `<div class="card-content">`;
        card += `<span class="text-danger" style="font-weight:bolder;">${task.durationMsg}</span><br>`;
        card += `Duration: ${durationText}<br>`;
        card += `ETA: ${etaText}<br>`;
        card += `Remaining Days: ${remainingDaysText}<br>`;
        card += `Assigned At: ${task.assigned_date || '-'}<br>`;
        card += `Started At: ${task.startedAt || '-'}<br>`;
        card += `Completed At: ${task.completedAt || '-'}<br>`;
        if (task.reviewedBy != "") {
            card += `Reviewed By: ${task.reviewed_user}<br>`;
            card += `Review Comment: ${task.reviewComment}<br>`;
        }
        card += `</div>`;

        card += `</div>`;

        return card;
    }
    //#endregion Kanban Card

    //#region Load Daily Tasks
    function LoadDailyTasks() {
        dynamicResponse(`/api/get_user_daily_tasks`, {}, {
            onSuccess: (res) => {
                renderDailyTaskBoard(res.data);
            },
            onError: (err) => {
                toastr.error(err.message);
            }
        });
    }

    let draggedCard = null;
    function renderDailyTaskBoard(data) {
        const board = document.getElementById('dailyTasks');
        board.innerHTML = '';

        data.tasks_status.forEach(statusObj => {
            const { status_code, status } = statusObj;

            const column = document.createElement('div');
            column.className = 'kanban-column';
            column.dataset.status = status_code;

            const title = document.createElement('h2');
            title.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;"><span>${status}</span><span class="badge bg-info">${data.status_counter?.[status] ?? 0}</span></div>`;

                if (status_code !== "REVIEW") {
                    card.draggable = true;

                    card.addEventListener('dragstart', () => {

                        card.classList.add('dragging');
                    });

                    });
                }

                column.appendChild(card);
            });

            // Column Drag & Drop
            column.addEventListener('dragover', e => {
                e.preventDefault();
                // RULE: Cannot drop into ASSIGNED column
                if (column.dataset.status !== "ASSIGNED") {
                    column.classList.add('drag-over');
                }
            });

            column.addEventListener('dragleave', () => column.classList.remove('drag-over'));

            column.addEventListener('drop', () => {
                column.classList.remove('drag-over');
                if (!draggedCard) return;

                const taskId = parseInt(draggedCard.dataset.id);
                const taskAssignId = parseInt(draggedCard.dataset.taskassignid, 10);
                const oldstatus = draggedCard.dataset.oldstatus;
                const workstatus = draggedCard.dataset.workstatus;
                const new_status = column.dataset.status;

                const leadBy = draggedCard.dataset.leadBy;

                // RULE: Prevent dropping into ASSIGNED column
                if (new_status === "ASSIGNED") {
                    toastr.error("Can't Drop Task To Assigned");
                    return;
                }

                if (new_status === "REVIEW") {
                    toastr.error("Can't Drop Task To Review");
                    return;
                }

                var objJson = new Object();
                objJson.taskId = taskId;
                objJson.taskAssignId = taskAssignId;

                if (new_status === "COMPLETED" && oldstatus === "COMPLETED" && workstatus === "APPROVED") {
                    Swal.fire({
                        title: 'Task Already Completed!',
                        text: 'You can reopen the task and select a new status.',
                        icon: 'warning',
                        input: 'select',
                        inputOptions: {
                            "NOT_STARTED": "Not Started",
                            "IN_PROGRESS": "In Progress",
                        },
                        inputPlaceholder: 'Select new status',
                        showCancelButton: true,
                        confirmButtonText: 'Update Status',
                        cancelButtonText: 'Cancel'
                    }).then((result) => {
                        if (result.isConfirmed && result.value) {
                            objJson.new_status = result.value;
                            UpdateTask(objJson);
                        }
                    });
                }
                else if (new_status === "COMPLETED") {
                    Swal.fire({
                        title: 'Task Completed!',
                        html: `This task is now going for approval. Lead by: <b>${leadBy}</b>`,
                        icon: 'info',
                        input: 'textarea',
                        inputPlaceholder: 'Enter approval comment...',
                        showCancelButton: true,
                        confirmButtonText: 'Send for Approval',
                        cancelButtonText: 'Cancel',
                        preConfirm: (comment) => {
                            if (!comment || comment.trim() === "") {
                                Swal.showValidationMessage('Please enter a comment for approval');
                            }
                            return comment.trim();
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            objJson.new_status = new_status;
                            objJson.submitComment = result.value;
                            UpdateTask(objJson);
                        }
                    });
                }
                else {
                    objJson.new_status = new_status;
                    UpdateTask(objJson);
                }
            });

            board.appendChild(column);
        });
    }
    //#endregion Load Daily Tasks

</script>
